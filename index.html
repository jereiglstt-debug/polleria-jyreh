<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollería Jyreh - Catálogo</title>
    <!-- Script Oficial de Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        header { background-color: #d90429; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .user-panel { display: flex; align-items: center; gap: 15px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-admin { background-color: #ffb703; color: #000; }
        .btn-logout { background-color: #2b2d42; color: white; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 180px; object-fit: cover; background-color: #eee; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .precio { font-size: 1.25rem; color: #d90429; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Pollería Jyreh</h1>
        <div class="user-panel">
            <!-- Saludo de bienvenida -->
            <span id="bienvenida-text"></span>
            
            <!-- Botón hacia el Panel Admin (Oculto por defecto) -->
            <a id="btn-admin-panel" href="/admin" class="btn btn-admin" style="display: none;">⚙️ Panel Admin</a>
            
            <!-- Botón Cierre de Sesión (Oculto por defecto) -->
            <button id="btn-logout" onclick="cerrarSesion()" class="btn btn-logout" style="display: none;">Cerrar Sesión</button>
            
            <!-- Contenedor del Botón Google Sign-In -->
            <div id="google-btn-container"></div>
        </div>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px;">Nuestros Productos</h2>
        <div id="productos-grid" class="grid">
            <!-- Se cargan dinámicamente -->
        </div>
    </div>

    <script>
        const CLIENT_ID = "671969205745-3jkucr332s9e8pdo49752f8ihh6k7fgs.apps.googleusercontent.com";

        document.addEventListener("DOMContentLoaded", () => {
            verificarSesionActiva();
            cargarProductos();
            inicializarGoogle();
        });

        // 1. Inicializar Botón de Google
        function inicializarGoogle() {
            window.onload = function () {
                google.accounts.id.initialize({
                    client_id: CLIENT_ID,
                    callback: handleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-btn-container"),
                    { theme: "outline", size: "large", text: "signin_with" }
                );
            };
        }

        // 2. Manejar Respuesta de Google despues del Login
        function handleCredentialResponse(response) {
            fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => {
                if (!res.ok) throw new Error("Error en autenticación");
                return res.json();
            })
            .then(data => {
                if (data.usuario) {
                    actualizarInterfaz(data.usuario);
                }
            })
            .catch(err => {
                console.error("Error al iniciar sesión:", err);
                alert("No se pudo iniciar sesión. Verifique las credenciales.");
            });
        }

        // 3. Verificar estado de la sesión activa al recargar la página
        function verificarSesionActiva() {
            fetch('/api/auth/me')
                .then(res => {
                    if (res.ok) return res.json();
                    throw new Error("Sin sesión");
                })
                .then(usuario => {
                    actualizarInterfaz(usuario);
                })
                .catch(() => {
                    actualizarInterfaz(null);
                });
        }

        // 4. Actualizar Elementos Visuales (Bienvenida y Botón Admin)
        function actualizarInterfaz(usuario) {
            const bienvenida = document.getElementById("bienvenida-text");
            const btnAdmin = document.getElementById("btn-admin-panel");
            const btnLogout = document.getElementById("btn-logout");
            const googleContainer = document.getElementById("google-btn-container");

            if (usuario) {
                bienvenida.textContent = `¡Hola, ${usuario.nombre_completo}!`;
                googleContainer.style.display = "none";
                btnLogout.style.display = "inline-block";

                // Mostrar botón de Admin ÚNICAMENTE si es_admin es true o 1
                if (usuario.es_admin) {
                    btnAdmin.style.display = "inline-block";
                } else {
                    btnAdmin.style.display = "none";
                }
            } else {
                bienvenida.textContent = "";
                googleContainer.style.display = "block";
                btnAdmin.style.display = "none";
                btnLogout.style.display = "none";
            }
        }

        // 5. Cierre de sesión
        function cerrarSesion() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(() => {
                    window.location.reload();
                });
        }

        // 6. Cargar catálogo de productos
        function cargarProductos() {
            fetch('/api/productos')
                .then(res => res.json())
                .then(productos => {
                    const grid = document.getElementById("productos-grid");
                    grid.innerHTML = "";
                    productos.forEach(p => {
                        grid.innerHTML += `
                            <div class="card">
                                <img src="${p.imagen_url || 'https://via.placeholder.com/300'}" alt="${p.nombre}">
                                <div class="card-body">
                                    <h3>${p.nombre}</h3>
                                    <p>${p.descripcion || ''}</p>
                                    <div class="precio">$${p.precio_venta} / ${p.unidad_medida}</div>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => console.error("Error al obtener productos:", err));
        }
    </script>
</body>
</html>
